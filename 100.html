<script>
    class PsychologyQuizApp {
        startQuiz(mode) {
            this.currentMode = mode;
            this.answers = {};
            this.streak = 0;

            if (mode === 'sequential') {
                this.activeQuestionList = [...this.questions];
                document.getElementById('quiz-mode-tag').innerText = '順序刷題';
            } else if (mode === 'random') {
                const shuffled = [...this.questions];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                this.activeQuestionList = shuffled;
                document.getElementById('quiz-mode-tag').innerText = '隨機挑戰';
            } else if (mode === 'mistake') {
                if (this.wrongQIds.size === 0) {
                    this.showToast('目前沒有錯題紀錄！非常優秀！');
                    return;
                }
                this.activeQuestionList = this.questions.filter(q => this.wrongQIds.has(q.id));
                document.getElementById('quiz-mode-tag').innerText = `錯題特訓 (${this.activeQuestionList.length}題)`;
            } else if (mode === 'bookmarked') {
                if (this.bookmarkedQIds.size === 0) {
                    this.showToast('尚未標記任何星號題目！答題時點擊 ⭐ 即可收藏。');
                    return;
                }
                this.activeQuestionList = this.questions.filter(q => this.bookmarkedQIds.has(q.id));
                document.getElementById('quiz-mode-tag').innerText = `星號收藏 (${this.activeQuestionList.length}題)`;
            }

            this.currentIndex = 0;
            document.getElementById('total-q-count').innerText = this.activeQuestionList.length;
            this.showView('view-quiz');
            this.renderQuestion();
        }
    }
</script>
