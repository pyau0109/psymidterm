<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url='100.html'" />
  <title>Redirecting...</title>
  <style>
    :root {
      --bg-start: #eef6ff;
      --bg-end: #dfe9ff;
      --card-bg: rgba(255, 255, 255, 0.9);
      --primary: #2c6bed;
      --primary-dark: #1d4dc9;
      --text: #1a1a1a;
      --muted: #4b5563;
      --shadow: rgba(44, 107, 237, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      color: var(--text);
    }

    .redirect-card {
      width: min(100%, 640px);
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 18px 42px var(--shadow);
      padding: clamp(1.5rem, 3vw, 3rem);
      text-align: center;
      backdrop-filter: blur(8px);
    }

    p {
      margin: 0;
      font-size: clamp(1rem, 2vw, 1.4rem);
      line-height: 1.7;
      color: var(--muted);
    }

    a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a:hover,
    a:focus {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .redirect-card {
        border-radius: 16px;
        padding: 1.25rem 1rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <p>Redirecting to <a href="200.html">200.html</a>...</p>
  </div>
</body>
</html>
